name: Run Pytest
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
    - features/**
  pull_request:
    branches:
    - main
    - master

jobs:
  tests:
    # Run tests for different PostGIS versions while we work on migrating the db.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgis_version:
        - 17-3.5
        - 18-3.7
    env:
      INITIALIZE_DB: false
      POSTGIS_VERSION: ${{ matrix.postgis_version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v1

    - name: Start containers
      run: docker compose -f "docker-compose.yml" up -d --build

    - name: Run tests
      run: docker compose exec -T web uv run --no-sync pytest -v --ds=tests.settings --show-capture=no --cov --cov-report=term:skip-covered

    - name: Build package
      run: docker compose exec -T web uv build --out-dir /tmp/dist

    - name: Log on failure
      if: failure()
      run: docker compose logs web

    - name: Stop containers
      if: always()
      run: docker compose -f "docker-compose.yml" down
